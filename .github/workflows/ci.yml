name: ISP-FinTrack CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint
      
    - name: Run Tests
      run: npm run test:run

    - name: Build Verification (Dry Run)
      run: npm run build
      env:
        # Provide dummy env vars for build process if necessary
        DATABASE_USER: postgres
        DATABASE_HOST: localhost
        DATABASE_NAME: clients
        DATABASE_PASSWORD: dummy
        DATABASE_PORT: 5432
        MIDTRANS_SERVER_KEY: dummy
        MIDTRANS_CLIENT_KEY: dummy
        GMAIL_USER: dummy
        GMAIL_APP_PASSWORD: dummy
